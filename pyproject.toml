[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-harness"
version = "0.1.0"
description = "Argus: an open harness for AI agents that reason and work on the physical world's data (cameras, tags, sensors, traffic) through a memory, on Meta models."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "JMV Metantel Private Limited", email = "projects@metantel.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "duckdb>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
argus-console = "argus.console.__main__:main"
argus-worker = "argus.worker:main"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.setuptools.package-data]
"argus.console" = ["static/*", "get_fonts.sh"]
